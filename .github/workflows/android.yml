name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: SDK platform compatibility
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Unit tests, lint, debug APK and UI test compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BundleTap-debug-Android17
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Optional persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.BUNDLETAP_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BUNDLETAP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUNDLETAP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUNDLETAP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No persistent signing key configured; debug APK remains available."
            exit 0
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Incomplete release signing secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bundletap-release.jks"
          BUNDLETAP_SIGNING_STORE="$RUNNER_TEMP/bundletap-release.jks" \
          BUNDLETAP_SIGNING_PASSWORD="$STORE_PASSWORD" \
          BUNDLETAP_SIGNING_ALIAS="$KEY_ALIAS" \
          BUNDLETAP_SIGNING_KEY_PASSWORD="$KEY_PASSWORD" \
            gradle --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/bundletap-release.jks"
      - name: Upload signed release APK if configured
        uses: actions/upload-artifact@v4
        with:
          name: BundleTap-signed-release-Android17
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 90
